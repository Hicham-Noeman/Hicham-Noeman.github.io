<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RDP70728BP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-RDP70728BP');
    // contact + CV clicks, reported as events (Reports > Engagement > Events)
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      var h = a.href, m = null;
      if (h.indexOf('wa.me/') > -1) m = 'whatsapp';
      else if (h.indexOf('mailto:') === 0) m = 'email';
      else if (h.indexOf('linkedin.com') > -1) m = 'linkedin';
      else if (h.indexOf('github.com') > -1) m = 'github';
      else if (h.indexOf('/cv/') > -1) { gtag('event', 'view_cv', { link_location: a.closest('section, nav') ? a.closest('section, nav').id || 'hero' : 'page' }); return; }
      if (m) gtag('event', 'contact_click', { method: m, link_location: a.id || (a.closest('section, nav') ? a.closest('section, nav').id || 'hero' : 'page') });
    });
  </script>
  <title>Page not found — Hicham Noeman</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#03060d">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #03060d; --text: #f2f6ff; --muted: #9aa8c2; --sky: #8cc4ff; --accent: #2f7bf6; --line: rgba(200,222,255,.16); }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; overflow-x: hidden;
      font-family: Manrope, "Segoe UI", system-ui, sans-serif; color: var(--text);
      background: radial-gradient(45% 55% at 72% 55%, rgba(47,123,246,.28), transparent 70%), var(--bg);
    }
    main {
      width: min(1040px, 100%); display: grid; grid-template-columns: 1.1fr .9fr; align-items: center; gap: 32px;
    }
    .copy { text-align: left; }
    .code { font-family: "JetBrains Mono", ui-monospace, monospace; color: var(--sky); font-size: .85rem; letter-spacing: .2em; }
    h1 { font-weight: 800; font-size: clamp(5rem, 16vw, 10rem); line-height: 1; letter-spacing: -.04em; margin: 14px 0 8px;
         background: linear-gradient(180deg, #fff, #6fa8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h2 { font-size: clamp(1.3rem, 3vw, 1.7rem); font-weight: 600; margin-bottom: 12px; }
    p { color: var(--muted); max-width: 30rem; margin: 0 0 30px; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    a { display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 100px; font-weight: 600; text-decoration: none; transition: background .3s, transform .3s; }
    .primary { background: var(--text); color: var(--bg); }
    .primary:hover { transform: translateY(-2px); }
    .ghost { color: var(--text); border: 1px solid var(--line); background: rgba(255,255,255,.04); }
    .ghost:hover { background: rgba(255,255,255,.1); }
    a:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; }

    .portrait { position: relative; justify-self: center; width: min(420px, 100%); aspect-ratio: 4 / 5; }
    .portrait::before {
      content: ""; position: absolute; inset: 12% 8% 0; border-radius: 50% 50% 0 0;
      background: radial-gradient(60% 60% at 50% 40%, rgba(47,123,246,.45), transparent 75%);
      filter: blur(20px);
    }
    .photo {
      position: absolute; inset: 0; cursor: crosshair; -webkit-tap-highlight-color: transparent; touch-action: pan-y;
      -webkit-mask-image: linear-gradient(#000 65%, transparent 96%); mask-image: linear-gradient(#000 65%, transparent 96%);
    }
    .photo img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center bottom;
      filter: grayscale(1) contrast(1.05) brightness(.95);
      user-select: none; -webkit-user-drag: none;
    }
    .photo canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    @media (max-width: 760px) {
      body { background: radial-gradient(70% 45% at 50% 28%, rgba(47,123,246,.28), transparent 70%), var(--bg); }
      main { grid-template-columns: 1fr; gap: 8px; }
      .portrait { order: -1; width: min(240px, 62vw); }
      .copy { text-align: center; }
      h1 { font-size: clamp(4rem, 24vw, 6rem); margin-top: 8px; }
      p { margin-left: auto; margin-right: auto; }
      .actions { justify-content: center; }
    }
  </style>
</head>
<body>
  <main>
    <div class="copy">
      <div class="code">// error: route not found</div>
      <h1>404</h1>
      <h2>Hmm, I can't find that page.</h2>
      <p>The link might be mistyped, or I've moved things around. You can head back to my homepage, or get in touch if you were looking for something specific.</p>
      <div class="actions">
        <a class="primary" href="/">Back to home</a>
        <a class="ghost" href="/#contact">Contact me</a>
      </div>
    </div>
    <figure class="portrait">
      <div class="photo" id="photo">
        <img src="/images/hicham-cutout.webp" alt="Portrait of Hicham Noeman" width="960" height="1200" decoding="async">
        <canvas id="brush" aria-hidden="true"></canvas>
      </div>
    </figure>
  </main>
  <script>
    /* Black & white portrait; colour is painted like a brush along the cursor / finger path and fades out ~1.5s later (same as homepage) */
    (() => {
      const box = document.getElementById("photo");
      const photo = box.querySelector("img");
      const canvas = document.getElementById("brush");
      const ctx = canvas.getContext("2d");
      const FADE = 1500;
      const strokes = [];
      let last = null, raf = 0, w = 0, h = 0, down = false;

      function sizeCanvas() {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        w = box.clientWidth; h = box.clientHeight;
        canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      }
      // draw the colour photo exactly where CSS draws the b&w one (object-fit: contain, bottom)
      function drawPhoto() {
        const iw = photo.naturalWidth, ih = photo.naturalHeight;
        const s = Math.min(w / iw, h / ih), dw = iw * s, dh = ih * s;
        ctx.drawImage(photo, (w - dw) / 2, h - dh, dw, dh);
      }
      function draw() {
        const now = performance.now();
        while (strokes.length && now - strokes[0].t > FADE) strokes.shift();
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 1;
        ctx.clearRect(0, 0, w, h);
        if (!photo.naturalWidth || !strokes.length) return;
        const R = Math.max(w * 0.1, 24);
        strokes.forEach(p => {
          const k = 1 - (now - p.t) / FADE;
          ctx.globalAlpha = k * k * (3 - 2 * k);
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
          g.addColorStop(0, "rgba(0,0,0,1)");
          g.addColorStop(0.5, "rgba(0,0,0,.6)");
          g.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = g;
          ctx.fillRect(p.x - R, p.y - R, R * 2, R * 2);
        });
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-in";
        drawPhoto();
      }
      function loop() {
        draw();
        raf = strokes.length ? requestAnimationFrame(loop) : 0;
      }
      function paint(e) {
        const r = box.getBoundingClientRect();
        const x = e.clientX - r.left, y = e.clientY - r.top, now = performance.now();
        if (last) {
          const dx = x - last.x, dy = y - last.y, d = Math.hypot(dx, dy);
          for (let s = 6; s < d; s += 6) strokes.push({ x: last.x + dx * s / d, y: last.y + dy * s / d, t: now });
        }
        strokes.push({ x, y, t: now });
        if (strokes.length > 800) strokes.splice(0, strokes.length - 800);
        last = { x, y };
        if (!raf) raf = requestAnimationFrame(loop);
      }

      new ResizeObserver(sizeCanvas).observe(box);
      photo.addEventListener("load", sizeCanvas);
      box.addEventListener("pointermove", e => { if (e.pointerType === "mouse" || down) paint(e); });
      box.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") { down = true; last = null; paint(e); } });
      ["pointerup", "pointercancel", "pointerleave"].forEach(t => box.addEventListener(t, () => { down = false; last = null; }));
    })();
  </script>
</body>
</html>
